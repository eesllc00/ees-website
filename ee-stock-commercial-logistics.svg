<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">EE Stock — commercial logistics in motion</title>
<desc id="desc">A detailed semi-truck drives steadily along a foreground road. Its wheels remain on the roadway. Behind it, a forklift carries a pallet past a distribution center with four loading docks.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#dfeaf0"/></linearGradient>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f6f9fb"/><stop offset="1" stop-color="#cad8e1"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#6e92a6"/><stop offset=".45" stop-color="#a2c4d4"/><stop offset=".48" stop-color="#c8dce7"/><stop offset="1" stop-color="#7c9bad"/></linearGradient>
 <linearGradient id="body" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".65" stop-color="#f2f6f8"/><stop offset="1" stop-color="#b9cbd7"/></linearGradient>
 <linearGradient id="cab" x2="1" y2="1"><stop stop-color="#82b5cf"/><stop offset=".6" stop-color="#4c87a7"/><stop offset="1" stop-color="#326680"/></linearGradient>
 <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#ecf2f5"/><stop offset=".5" stop-color="#95aab8"/><stop offset="1" stop-color="#d8e4eb"/></linearGradient>
 <linearGradient id="asphalt" x2="0" y2="1"><stop stop-color="#738691"/><stop offset="1" stop-color="#536976"/></linearGradient>
 <pattern id="shutter" width="108" height="10" patternUnits="userSpaceOnUse"><rect width="108" height="10" fill="#aabcc7"/><path d="M0 9H108" stroke="#8ea4b1"/></pattern>
 <pattern id="siding" width="16" height="150" patternUnits="userSpaceOnUse"><path d="M0 0V150" stroke="#8ba2b0" opacity=".18"/></pattern>
 <pattern id="ribs" width="14" height="160" patternUnits="userSpaceOnUse"><path d="M0 0V160" stroke="#90a7b6" opacity=".17"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
 <g id="tree"><path d="M0 0V-58" stroke="#91a6ad" stroke-width="4"/><ellipse cy="-65" rx="23" ry="40" fill="#acbfc1"/><ellipse cx="-8" cy="-70" rx="14" ry="27" fill="#bacbcb"/></g>
 <style>
 .small{font:10px Arial,sans-serif;letter-spacing:2px;fill:#708794}
 .truck-motion{animation:haul 18s linear infinite;animation-delay:-7.5s}
 .spin{animation:roll 1.22s linear infinite}
 .fork-motion{animation:transfer 12s ease-in-out infinite}
 @keyframes haul{from{transform:translateX(-610px)}to{transform:translateX(1630px)}}
 @keyframes roll{to{transform:rotate(360deg)}}
 @keyframes transfer{0%,12%,100%{transform:translateX(0)}45%,60%{transform:translateX(120px)}}
 @media(prefers-reduced-motion:reduce){.truck-motion{animation:none;transform:translateX(500px)}.spin,.fork-motion{animation:none}}
 </style>
</defs>
